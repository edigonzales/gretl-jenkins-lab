apiVersion: apps/v1
kind: Deployment
metadata:
  name: gretl-static
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: gretl-static}
  template:
    metadata:
      labels: {app: gretl-static}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: agent
          image: gretl-lab-tools:local
          imagePullPolicy: Never
          env:
            - {name: JENKINS_URL, value: "http://jenkins:8080"}
            - {name: JENKINS_AGENT_NAME, value: gretl-static}
            - {name: JENKINS_WEB_SOCKET, value: "true"}
            - name: JENKINS_SECRET
              valueFrom:
                secretKeyRef: {name: gretl-static, key: secret}
          resources:
            requests: {cpu: 400m, memory: 1280Mi}
            limits: {cpu: "2", memory: 4096Mi}
