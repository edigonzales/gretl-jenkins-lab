apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: gretl-jenkins-lab
servers: 1
agents: 0
image: rancher/k3s:v1.35.5-k3s1
kubeAPI:
  host: "127.0.0.1"
  hostIP: "127.0.0.1"
options:
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false
  k3s:
    extraArgs:
      - arg: "--disable=traefik,servicelb"
        nodeFilters: [server:0]
